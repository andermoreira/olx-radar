name: OLX Radar triage

on:
  issue_comment:
    types: [created]
  issues:
    types: [closed]

permissions: {}

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            python -m radar triage --issue "$ISSUE_NUMBER" --closed
          else
            python -m radar triage --issue "$ISSUE_NUMBER" --comment "$COMMENT_BODY"
          fi
